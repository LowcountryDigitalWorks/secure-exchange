name: Apply Release 0.5 format

on:
  push:
    branches:
      - release/0.5-local-development-vertical-slice

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Format Release 0.5 implementation
        run: >-
          npx --no-install prettier --write
          src/application/id-generator.ts
          src/http/app.ts
          src/http/development-demo.ts
          src/server.ts
          tests/e2e/baseline.spec.ts
          tests/e2e/development-demo.spec.ts
          tests/integration/development-demo-http.test.ts
          tests/integration/reply-lifecycle.test.ts
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/application/id-generator.ts src/http/app.ts src/http/development-demo.ts src/server.ts tests/e2e/baseline.spec.ts tests/e2e/development-demo.spec.ts tests/integration/development-demo-http.test.ts tests/integration/reply-lifecycle.test.ts
          git commit -m "Format Release 0.5 implementation"
          git push origin HEAD:${GITHUB_REF_NAME}
