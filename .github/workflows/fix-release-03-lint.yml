name: Fix Release 0.3 lint

on:
  push:
    branches:
      - release/0.3-workflow-core-prototype

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply narrow lint corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/application/workflow-service.ts")
          text = path.read_text()
          old = '''      authorization === undefined ||
      !authorization.active ||'''
          new = '''      authorization?.active !== true ||'''
          if old not in text:
              raise SystemExit("authorization lint target not found")
          text = text.replace(old, new, 1)
          old = '''    if (policy === undefined || policy.deploymentId !== deploymentId) {'''
          new = '''    if (policy?.deploymentId !== deploymentId) {'''
          if old not in text:
              raise SystemExit("policy lint target not found")
          text = text.replace(old, new, 1)
          old = '''        actor !== undefined &&
        actor.active &&'''
          new = '''        actor?.active === true &&'''
          if old not in text:
              raise SystemExit("actor lint target not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx --no-install prettier --write \
            src/application/workflow-service.ts \
            src/adapters/in-memory-workflow-store.ts
      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet -- \
            src/application/workflow-service.ts \
            src/adapters/in-memory-workflow-store.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/application/workflow-service.ts \
            src/adapters/in-memory-workflow-store.ts
          git commit -m "Apply Release 0.3 lint corrections"
          git push origin HEAD:${GITHUB_REF_NAME}
