name: Diagnose Release 0.6 attachment lint line

on:
  push:
    branches:
      - release/0.6-attachment-safety-core

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate and inspect candidate source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          helper = Path('.github/workflows/apply-release-06-core.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(helper) if line.strip() == "python3 <<'PY'") + 1
          end = next(index for index in range(start, len(helper)) if helper[index].strip() == 'PY')
          Path('/tmp/apply-release-06.py').write_text(textwrap.dedent('\n'.join(helper[start:end])) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply-release-06.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/adapters/in-memory-workflow-store.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  type ActorAuthorization,\n', '  type ActorAuthorization,\n  type Attachment,\n  type AttachmentFilePolicy,\n  type AttachmentId,\n', 1)
          source = source.replace('  type Message,\n', '  type Message,\n  type MessageId,\n', 1)
          path.write_text(source, encoding='utf-8')

          path = Path('src/application/attachment-service.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace('message.threadId !==', 'message?.threadId !==')
          source = source.replace('attachment.threadId !==', 'attachment?.threadId !==')
          source = source.replace('attachment.messageId !==', 'attachment?.messageId !==')
          source = source.replace(
              'content === undefined ||\n                content.byteLength !== attachment.sizeBytes',
              'content?.byteLength !== attachment.sizeBytes',
          )
          path.write_text(source, encoding='utf-8')

          path = Path('tests/integration/attachment-service.test.ts')
          source = path.read_text(encoding='utf-8').replace('  QUEUE_A,\n', '').replace('  STAFF_A,\n', '')
          path.write_text(source, encoding='utf-8')
          PY
          npm version 0.6.0 --no-git-tag-version --ignore-scripts
          npx --no-install prettier --write src/application/attachment-service.ts src/adapters/in-memory-workflow-store.ts tests/integration/attachment-service.test.ts >/dev/null
          echo '--- attachment-service.ts lines 292-308 ---'
          nl -ba src/application/attachment-service.ts | sed -n '292,308p'
          echo '--- ESLint ---'
          npx --no-install eslint src/application/attachment-service.ts -f stylish || true
