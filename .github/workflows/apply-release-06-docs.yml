name: Apply Release 0.6 documentation

on:
  push:
    branches:
      - release/0.6-attachment-safety-core

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Reconcile Release 0.6 documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def append(path: str, marker: str, section: str) -> None:
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              if marker in source:
                  return
              p.write_text(source.rstrip() + '\n\n' + dedent(section).strip() + '\n', encoding='utf-8')

          readme = Path('README.md')
          source = readme.read_text(encoding='utf-8')
          source = source.replace(
              '**Release 0.5 implements the Local Development Vertical Slice.** It wires the provider-neutral Release 0.3 workflow core and Release 0.4 conversation/queue core into a disabled-by-default, server-rendered **Synthetic Development Demo** covering accountless synthetic initiation, a server-owned staff queue context, authoritative conversation open/read, chronological messages, and authorized staff reply.\n\nRelease 0.5 is a development delivery adapter only. It is not production authentication, a production public portal, a regulated deployment, or production infrastructure. It does not add attachments, external secure retrieval/reply, AccessGrant secrets, email delivery, AWS adapters, or customer integrations.',
              '**Release 0.6 implements the Attachment Safety Core Prototype.** It adds provider-neutral attachment metadata and policy semantics, quarantine/scan-state handling, a protected-content port with an in-memory synthetic adapter, authoritative staff attachment retrieval, and download evidence that can only be created by a successful authoritative retrieval.\n\nRelease 0.6 remains a synthetic/local application prototype. It does not expose arbitrary browser file upload/download, production authentication, a production public portal, real malware scanning, production object storage, AWS infrastructure, AccessGrant, customer data, or PHI.',
          )
          source = source.replace(
              'Release 0.5 preserves these independent facts:',
              'Release 0.6 preserves these independent facts:',
          )
          source = source.replace(
              'npm test -- tests/integration/development-demo-http.test.ts tests/integration/same-origin-http.test.ts\n```',
              'npm test -- tests/integration/development-demo-http.test.ts tests/integration/same-origin-http.test.ts\nnpm test -- tests/unit/attachment.test.ts tests/integration/attachment-service.test.ts\n```',
          )
          source = source.replace(
              '- [Release 0.5 implementation boundary](docs/releases/0.5-local-development-vertical-slice.md)',
              '- [Release 0.6 implementation boundary](docs/releases/0.6-attachment-safety-core.md)\n- [Release 0.5 implementation boundary](docs/releases/0.5-local-development-vertical-slice.md)',
          )
          source = source.replace(
              'Browser forms do not supply authoritative thread, message, audit-event, deployment, queue-authorization, or external actor/reference identifiers. The local delivery adapter generates opaque external participant, thread, message, and audit IDs server-side behind an injectable provider-neutral boundary.\n\nThe local in-memory store',
              'Browser forms do not supply authoritative thread, message, audit-event, deployment, queue-authorization, or external actor/reference identifiers. The local delivery adapter generates opaque external participant, thread, message, and audit IDs server-side behind an injectable provider-neutral boundary.\n\nAttachments are application-only in Release 0.6. Newly ingested synthetic content is published as `QUARANTINED`, never `CLEAN`; only a validated clean scan outcome can make an attachment normally retrievable. Declared extension/MIME/media category validation is policy input, not authoritative content-signature verification.\n\nThe local in-memory store',
          )
          readme.write_text(source, encoding='utf-8')

          append('docs/PRODUCT.md', '## Release 0.6 attachment-safety boundary', '''
          ## Release 0.6 attachment-safety boundary

          Release 0.6 adds the provider-neutral attachment safety core required before browser file transfer can be considered. The implemented boundary is application/integration-test driven and synthetic only. It introduces attachment metadata, bounded declared-metadata policy checks, quarantine and normalized scan outcomes, protected-content storage behind an application port, authoritative staff retrieval, and retrieval-coupled Downloaded evidence.

          New content is never silently trusted. Successful ingestion stages synthetic bytes under an opaque content reference and atomically publishes attachment metadata in `QUARANTINED`. A clean normalized scan result is required before the normal retrieval service can return bytes. `PENDING_UPLOAD`, `QUARANTINED`, `REJECTED`, and `DELETED` all fail closed for normal retrieval.

          Declared filename extension, media category, and MIME type are policy inputs only. Release 0.6 does not perform content-signature/file-format verification; production ingestion must add an authoritative content-classification/type-verification gate before untrusted uploads are released.

          Arbitrary browser upload/download, real malware scanning, production object storage, AccessGrant, production authentication, customer data, PHI, and AWS infrastructure remain outside this release.
          ''')

          append('docs/MVP_AND_ROADMAP.md', '## Release 0.6 implemented attachment-safety core', '''
          ## Release 0.6 implemented attachment-safety core

          Release 0.6 implements, with synthetic bytes only:

          - provider-neutral Attachment metadata and five approved safety states;
          - bounded per-deployment attachment policy for individual size, per-message count, declared media category/type, and extension;
          - separate original display filename and derived safe-download filename;
          - opaque provider-neutral protected-content references independent of filenames;
          - a protected-content port plus process-memory development adapter;
          - application-only ingestion that publishes new content as `QUARANTINED`;
          - trusted SYSTEM scan-result handling for `CLEAN`, `MALICIOUS`, and `INDETERMINATE` outcomes;
          - replay-safe/current-state attachment scan transitions;
          - authoritative staff retrieval requiring live deployment/thread/message/attachment/queue/permission/state checks before content access;
          - `ATTACHMENT_DOWNLOADED` creation only after protected content resolves successfully;
          - staged-content compensation when metadata publication fails;
          - deterministic failure coverage for partial content/metadata boundaries.

          `ATTACHMENT_DOWNLOADED` remains independent from `THREAD_OPENED`, TransferAttestation, thread lifecycle, and completion. The old standalone workflow download-evidence operation is removed so future HTTP/browser code cannot bypass authoritative attachment retrieval.

          Still deferred: browser upload/download delivery, content-signature/type detection, real malware scanning, production object storage, attachment deletion/disposition orchestration, AccessGrant/external retrieval, notifications, durable production persistence, AWS adapters/infrastructure, customer data/PHI, archive extraction, OCR, parsing, preview, and AI processing.
          ''')

          append('docs/architecture/DOMAIN_MODEL.md', '## Release 0.6 implemented Attachment model', '''
          ## Release 0.6 implemented Attachment model

          Release 0.6 makes the approved Attachment concept executable while keeping provider details outside the domain/application contract.

          An Attachment records: opaque attachment/deployment/thread/message identifiers; untrusted original display filename; separately derived safe-download filename; normalized declared media category/type/extension; byte length; opaque protected-content reference; current safety state; created time; optimistic version; and bounded normalized scan-result metadata when present.

          Authoritative states remain exactly:

          - `PENDING_UPLOAD`
          - `QUARANTINED`
          - `CLEAN`
          - `REJECTED`
          - `DELETED`

          The current application ingestion operation stages bytes and publishes the attachment directly as `QUARANTINED`; it does not expose browser staging or persist a client-driven `PENDING_UPLOAD` workflow. `PENDING_UPLOAD` remains a valid provider-neutral state for a later real ingestion/staging adapter. From `QUARANTINED`, a validated clean result transitions to `CLEAN`, a malicious result transitions to `REJECTED`, and an indeterminate result remains `QUARANTINED` with a versioned normalized scan record. New scan results from non-quarantined states fail closed. Exact replay of the same normalized scan-result reference/outcome is idempotent.

          Only `CLEAN` with no deletion marker is eligible for normal retrieval. The other states are non-retrievable. Release 0.6 models `DELETED` as non-retrievable but deliberately does not introduce a general attachment deletion/disposition application operation.

          Filename is never a storage locator. The original value is retained only as bounded untrusted display metadata; `safeDownloadFilename` removes directory semantics/control characters and is separately length-bounded for a future HTTP adapter.
          ''')

          append('docs/architecture/DATA_FLOW.md', '## Release 0.6 attachment ingestion, scan, and retrieval flows', '''
          ## Release 0.6 attachment ingestion, scan, and retrieval flows

          Release 0.6 adds three application-only synthetic flows.

          **Ingestion:** the application validates authoritative deployment/thread/message ownership and the current attachment policy before touching protected content. It generates opaque attachment/content references server-side, stages a copy of synthetic bytes through `ProtectedContentStore`, then atomically publishes `QUARANTINED` metadata plus minimized registration/quarantine audit events. If protected-content staging fails, no metadata is published. If metadata publication fails after staging, the application attempts provider-neutral staged-content deletion as compensation and reports failure; it never pretends object storage and metadata share one physical transaction.

          **Scan result:** a narrow trusted SYSTEM application boundary receives only a bounded normalized scan-result reference and normalized outcome. It revalidates deployment/thread/message/attachment association and current attachment state, applies the versioned transition, and commits state plus minimized audit together. No scanner raw payload or file bytes enter application audit.

          **Staff retrieval:** the application first validates actor deployment, authoritative thread, live staff authorization, queue scope, `ATTACHMENT_READ`, authoritative message, attachment deployment/thread/message association, exactly `CLEAN` safety state, and no deletion marker. Only after those checks does it resolve bytes through `ProtectedContentStore`. Missing/failed/inconsistent content fails with no download evidence. Once bytes resolve successfully, the application commits `ATTACHMENT_DOWNLOADED`; only after that audit commit succeeds does it return a provider-neutral retrieval result.

          Release 0.6 adds no browser upload/download route, permanent/public URL, AccessGrant, presigned URL, filesystem path, or AWS object-store contract.
          ''')

          append('docs/architecture/ACCESS_PATTERNS.md', '## Release 0.6 attachment access-pattern implementation', '''
          ## Release 0.6 attachment access-pattern implementation

          The in-memory WorkflowStore now supports authoritative attachment metadata lookup by deployment + attachment ID, per-message attachment listing for count enforcement, current per-deployment attachment policy, and versioned attachment updates inside the existing copy-on-write transaction boundary.

          Protected bytes are intentionally separate behind `ProtectedContentStore` (`put`, `get`, `delete`) using opaque `ProtectedContentRef` values. The Release 0.6 in-memory implementation stores cloned `Uint8Array` values for tests/development only. Its map keys are not S3 keys, filesystem paths, DynamoDB keys, or a future provider schema.

          Production adapters must preserve the ordering/compensation invariant demonstrated here: content staging can succeed before metadata publication, so metadata publication failure requires cleanup/orphan handling rather than assuming a distributed transaction. Retrieval must authorize against authoritative metadata before object access and must not emit successful download evidence until the object is actually resolved.
          ''')

          append('docs/security/AUTHORIZATION.md', '## Release 0.6 attachment authorization boundary', '''
          ## Release 0.6 attachment authorization boundary

          Release 0.6 adds one staff permission: `ATTACHMENT_READ`. Staff retrieval requires a live STAFF authorization in the requested deployment, current queue scope for the authoritative thread, and that permission. Knowledge of an attachment ID, message ID, thread ID, queue candidate, or cached summary never grants retrieval authority.

          The retrieval service validates actor deployment and authoritative thread before message/attachment access, then verifies the attachment belongs to the same deployment, thread, and expected message and is exactly `CLEAN` before the protected-content port is called.

          Scan processing does not impersonate staff. It uses a narrow trusted SYSTEM application boundary with a server-held system actor reference for minimized audit events. Clients do not select scanner identity, scan permissions, or authoritative scan state.

          The former `DOWNLOAD_EVIDENCE_RECORD` permission and standalone `WorkflowService.recordDownloadEvidence()` path are removed. Normal application `ATTACHMENT_DOWNLOADED` evidence is now reachable only through successful authoritative attachment retrieval.
          ''')

          append('docs/security/THREAT_MODEL.md', '## Release 0.6 attachment-safety controls', '''
          ## Release 0.6 attachment-safety controls

          Release 0.6 treats every supplied attachment as untrusted. Filename, extension, declared MIME type, and declared media category are not proof of actual content. The current policy gate only bounds declared metadata; production content-signature/type verification remains mandatory before arbitrary untrusted browser ingestion can be considered safe.

          Content is staged under an opaque server-generated reference independent of the filename and is published as `QUARANTINED`. Only a validated clean normalized scan outcome can move the attachment to `CLEAN`; malicious results become `REJECTED`, and indeterminate/failure outcomes remain non-retrievable. Unknown/invalid/current-state-violating scan results fail closed.

          Retrieval is metadata-authoritative and occurs before no object read: deployment, thread, staff authorization, queue scope, permission, message association, attachment association, safety state, and deletion state are all checked before protected bytes are requested. Object-store existence alone never grants access.

          Audit intentionally excludes file bytes, message bodies, unrestricted filenames, provider storage paths, credentials, grant secrets, and raw scanner payloads. Release 0.6 uses synthetic bytes in process memory only and adds no disk persistence, localStorage, public URLs, inline preview, parser, archive extraction, OCR, or AI processing.
          ''')

          append('docs/security/TEST_AND_SECURITY_STRATEGY.md', '## Release 0.6 attachment-safety coverage', '''
          ## Release 0.6 attachment-safety coverage

          Release 0.6 adds deterministic domain/application coverage for attachment policy, filename normalization, safety state, normalized scan results, protected-content storage, authorization/isolation, download evidence, and compensation boundaries.

          New unit coverage verifies bounded valid metadata, size/type/extension rejection, path/control-shaped filenames, invalid policy configuration, clean/malicious/indeterminate scan behavior, replay behavior, invalid current-state transitions, and retrieval eligibility across all non-clean states.

          New integration coverage verifies QUARANTINED publication, per-message count enforcement, protected-content write failure, metadata-commit compensation, successful clean scan/retrieval, malicious/indeterminate handling, scan replay and rollback, cross-deployment scan rejection, cross-deployment/wrong-thread/wrong-message retrieval denial, missing queue scope/permission denial, missing/failed content behavior, DELETED fail-closed behavior, exact successful-download audit creation, no TransferAttestation/completion/thread mutation from download, and absence of content/unrestricted filename values from audit.

          Every Release 0.2-0.5 regression remains part of `npm run validate`, including desktop/mobile Playwright and accessibility coverage for the existing synthetic browser demo. Release 0.6 deliberately adds no attachment browser route, so no new attachment-specific browser test is required.
          ''')

          append('docs/development/DEVELOPMENT.md', '## Release 0.6 attachment prototype development boundary', '''
          ## Release 0.6 attachment prototype development boundary

          Attachment ingestion, scan processing, and retrieval are application/integration-test driven in Release 0.6. The Release 0.5 browser demo has no arbitrary attachment upload/download UI or route.

          `InMemoryProtectedContentStore` is development/test-only and may hold cloned synthetic byte arrays in process memory. Do not use real customer/client/patient/regulated data or PHI. Do not substitute disk files, browser localStorage, public URLs, or provider credentials into this prototype.

          The attachment policy validates declared metadata only. It is intentionally not a file parser or signature detector. Do not describe a passing filename/MIME/extension policy check as proof of actual content type.

          Focused attachment tests:

          ```sh
          npm test -- tests/unit/attachment.test.ts tests/integration/attachment-service.test.ts
          ```
          ''')

          release = Path('docs/releases/0.6-attachment-safety-core.md')
          release.parent.mkdir(parents=True, exist_ok=True)
          release.write_text(dedent('''
          # Release 0.6 — Attachment Safety Core Prototype

          ## Status

          Release 0.6 is a synthetic/local provider-neutral attachment-safety prototype. It does not expose production file transfer or provision infrastructure.

          ## Implemented

          - provider-neutral Attachment metadata with `PENDING_UPLOAD`, `QUARANTINED`, `CLEAN`, `REJECTED`, and `DELETED` states;
          - bounded per-deployment declared-metadata file policy;
          - untrusted original filename plus separately derived safe-download filename;
          - opaque attachment/content references generated server-side;
          - provider-neutral `ProtectedContentStore` and process-memory synthetic adapter;
          - application-only ingestion that validates authoritative thread/message ownership and publishes staged content as `QUARANTINED`;
          - normalized trusted SYSTEM scan-result boundary for clean, malicious, and indeterminate outcomes;
          - versioned/replay-safe scan transitions;
          - one staff permission, `ATTACHMENT_READ`, used with live deployment/thread/queue authorization;
          - authoritative attachment retrieval requiring exactly `CLEAN` before protected-content access;
          - retrieval result containing safe filename, normalized content type, byte length, and synthetic bytes without a public URL;
          - `ATTACHMENT_DOWNLOADED` emitted only after protected content successfully resolves and its audit commit succeeds;
          - removal of the standalone synthetic download-evidence service/permission;
          - staged-content cleanup compensation if metadata publication fails;
          - deterministic failure tests for metadata/content transaction boundaries.

          ## State and scan semantics

          Current application ingestion stages synthetic bytes and publishes `QUARANTINED`; it never marks new content `CLEAN`. `PENDING_UPLOAD` remains an approved domain state for a later real staging/upload adapter but is not a browser-driven flow in this release.

          `QUARANTINED + CLEAN -> CLEAN`.

          `QUARANTINED + MALICIOUS -> REJECTED`.

          `QUARANTINED + INDETERMINATE -> QUARANTINED` with a versioned normalized scan record.

          Only `CLEAN` is normally retrievable. `PENDING_UPLOAD`, `QUARANTINED`, `REJECTED`, `DELETED`, unknown, invalid, or deleted-marked attachments fail closed. Exact replay of the same normalized scan-result reference/outcome is idempotent; conflicting replay or new scan transitions from non-quarantined states fail.

          ## Declared metadata limitation

          Allowed extension, MIME type, and media category are bounded policy inputs. They remain caller-declared metadata and are **not** authoritative content-signature/type verification. Production arbitrary upload requires a later authoritative content classification/type verification gate; no large parser/file-identification dependency is introduced in 0.6.

          ## Download evidence invariant

          Normal application download evidence now exists only inside `AttachmentService.retrieveStaffAttachment()` after:

          1. actor deployment matches;
          2. authoritative thread is resolved;
          3. live STAFF authorization includes current queue scope and `ATTACHMENT_READ`;
          4. authoritative message is resolved;
          5. attachment deployment/thread/message association matches;
          6. attachment state is exactly `CLEAN` and not deleted;
          7. protected content exists, resolves successfully, and matches the recorded byte length.

          Only then is `ATTACHMENT_DOWNLOADED` committed. The retrieval result is returned only if that audit commit succeeds. Authorization/state/content failures emit no successful download event.

          Download remains distinct from Opened, TransferAttestation, lifecycle transition, and completion.

          ## Failure/compensation boundary

          Protected content and workflow metadata deliberately do not pretend to share a distributed transaction. Ingestion stages content first and then publishes metadata/audit using the existing atomic WorkflowStore commit. If publication fails, the service attempts deletion of the staged content. Failure to confirm that cleanup is surfaced explicitly rather than hidden.

          Scan attachment state and its minimized audit events commit atomically within WorkflowStore. Retrieval content failure occurs before download audit. The prototype therefore proves the key ordering/compensation semantics without selecting an AWS-specific mechanism.

          ## Browser boundary

          No arbitrary browser upload route or attachment download route was added. The Release 0.5 Synthetic Development Demo remains unchanged. Browser delivery can be considered in a later release after the application core is reviewed.

          ## Non-goals retained

          No production authentication, Cognito, production sessions, AccessGrant, external secure retrieval/reply, email, real malware scanner, GuardDuty, S3, KMS, DynamoDB, SES, API Gateway/Lambda, AWS SDK, infrastructure as code, Cloudflare/AWS production deployment, customer data, PHI, inline preview, OCR, document parsing, archive extraction, AI processing, analytics, or paid service is introduced.

          ## Cost and dependencies

          New recurring cost: **$0**.

          No runtime or development dependency version is added or changed. Package metadata advances from `0.5.0` to `0.6.0` only.
          ''').strip() + '\n', encoding='utf-8')
          PY
      - name: Normalize documentation
        run: >-
          npx --no-install prettier --write
          README.md
          docs/PRODUCT.md
          docs/MVP_AND_ROADMAP.md
          docs/architecture/DOMAIN_MODEL.md
          docs/architecture/DATA_FLOW.md
          docs/architecture/ACCESS_PATTERNS.md
          docs/security/AUTHORIZATION.md
          docs/security/THREAT_MODEL.md
          docs/security/TEST_AND_SECURITY_STRATEGY.md
          docs/development/DEVELOPMENT.md
          docs/releases/0.6-attachment-safety-core.md
      - name: Validate documentation tree
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Commit Release 0.6 documentation
        shell: bash
        run: |
          if git diff --quiet -- README.md docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs
          git commit -m "Document Release 0.6 attachment safety boundary"
          git push origin HEAD:${GITHUB_REF_NAME}
