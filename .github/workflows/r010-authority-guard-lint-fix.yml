name: Release 0.10 Authority Guard Lint Finalizer

on:
  push:
    branches:
      - release/0.10-external-reply-core

permissions:
  contents: write

concurrency:
  group: release-0.10-authority-guard-lint-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.10-external-reply-core
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Apply exact lint-only corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("src/adapters/in-memory-workflow-store.ts"): (
                  "current === undefined ||\n        current.deploymentId !== guard.deploymentId ||",
                  "current?.deploymentId !== guard.deploymentId ||",
              ),
              Path("tests/integration/external-reply-authority-guard.test.ts"): (
                  "current === undefined || current.threadId !== mutation.threadId",
                  "current?.threadId !== mutation.threadId",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one lint target in {path}")
              path.write_text(text.replace(old, new))

      - name: Format corrected files
        run: npx --no-install prettier --write src/adapters/in-memory-workflow-store.ts tests/integration/external-reply-authority-guard.test.ts

      - name: Remove temporary finalizer
        run: rm .github/workflows/r010-authority-guard-lint-fix.yml

      - name: Run complete validation
        run: npm run validate

      - name: Commit permanent correction only
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          git commit -m "Finalize Release 0.10 authority guard correction"
          git push origin HEAD:release/0.10-external-reply-core
