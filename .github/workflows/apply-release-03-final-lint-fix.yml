name: Apply Release 0.3 final lint fix

on:
  push:
    branches:
      - release/0.3-workflow-core-prototype

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply final lint corrections
        shell: bash
        run: |
          perl -0pi -e 's/thread === undefined \|\| thread\.deploymentId !== input\.deploymentId/thread?.deploymentId !== input.deploymentId/' src/application/workflow-service.ts
          perl -0pi -e 's/    try \{\n      this\.commitSynchronously\(mutation\);\n      return Promise\.resolve\(\);\n    \} catch \(error: unknown\) \{\n      return Promise\.reject\(error\);\n    \}/    return Promise.resolve().then(() => {\n      this.commitSynchronously(mutation);\n    });/' src/adapters/in-memory-workflow-store.ts
          npx --no-install prettier --write src/application/workflow-service.ts src/adapters/in-memory-workflow-store.ts
      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet -- src/application/workflow-service.ts src/adapters/in-memory-workflow-store.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/application/workflow-service.ts src/adapters/in-memory-workflow-store.ts
          git commit -m "Finish Release 0.3 lint corrections"
          git push origin HEAD:${GITHUB_REF_NAME}
