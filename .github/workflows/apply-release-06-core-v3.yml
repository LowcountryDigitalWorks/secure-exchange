name: Apply final Release 0.6 attachment core

on:
  push:
    branches:
      - release/0.6-attachment-safety-core

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply and validate Release 0.6 core
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/apply-release-06-core.yml').read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(helper) if line.strip() == "python3 <<'PY'") + 1
          end = next(index for index in range(start, len(helper)) if helper[index].strip() == 'PY')
          Path('/tmp/apply-release-06.py').write_text(
              textwrap.dedent('\n'.join(helper[start:end])) + '\n',
              encoding='utf-8',
          )
          PY
          python3 /tmp/apply-release-06.py
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/adapters/in-memory-workflow-store.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '  type ActorAuthorization,\n',
              '  type ActorAuthorization,\n  type Attachment,\n  type AttachmentFilePolicy,\n  type AttachmentId,\n',
              1,
          )
          source = source.replace(
              '  type Message,\n',
              '  type Message,\n  type MessageId,\n',
              1,
          )
          path.write_text(source, encoding='utf-8')

          path = Path('src/application/attachment-service.ts')
          source = path.read_text(encoding='utf-8').replace(
              'message.threadId !==',
              'message?.threadId !==',
          )
          path.write_text(source, encoding='utf-8')

          path = Path('tests/integration/attachment-service.test.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace('  QUEUE_A,\n', '').replace('  STAFF_A,\n', '')
          path.write_text(source, encoding='utf-8')
          PY
          npm version 0.6.0 --no-git-tag-version --ignore-scripts
          npx --no-install prettier --write \
            src/domain/attachment.ts \
            src/domain/errors.ts \
            src/domain/evidence.ts \
            src/domain/index.ts \
            src/domain/types.ts \
            src/application/attachment-service.ts \
            src/application/errors.ts \
            src/application/id-generator.ts \
            src/application/ports.ts \
            src/application/protected-content.ts \
            src/application/workflow-service.ts \
            src/adapters/index.ts \
            src/adapters/in-memory-protected-content-store.ts \
            src/adapters/in-memory-workflow-store.ts \
            tests/helpers/workflow-fixture.ts \
            tests/integration/attachment-service.test.ts \
            tests/integration/workflow-service.test.ts \
            tests/unit/attachment.test.ts \
            package.json package-lock.json
          npx --no-install eslint src/application/attachment-service.ts --fix
          npm run lint
          npm run typecheck
          npm test
      - name: Commit Release 0.6 core
        shell: bash
        run: |
          if git diff --quiet -- src tests package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src tests package.json package-lock.json
          git commit -m "Implement Release 0.6 attachment safety core"
          git push origin HEAD:${GITHUB_REF_NAME}
