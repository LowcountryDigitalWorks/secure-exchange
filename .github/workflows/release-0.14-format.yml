name: Release 0.14 temporary formatter

on:
  push:
    branches:
      - release/0.14-synthetic-commercial-workflow-demo
    paths:
      - .github/workflows/release-0.14-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.14-synthetic-commercial-workflow-demo
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply repository formatter
        run: npm run format
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Release 0.14 work in progress"
          git push origin HEAD:release/0.14-synthetic-commercial-workflow-demo

# Trigger strict CI checkpoint after formatted acceptance coverage.
