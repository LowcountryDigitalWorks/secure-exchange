name: Release 0.14 temporary formatter

on:
  push:
    branches:
      - release/0.14-synthetic-commercial-workflow-demo
    paths:
      - .github/workflows/release-0.14-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.14-synthetic-commercial-workflow-demo
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply Release 0.14 documentation reconciliation
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def decode(value: str) -> str:
              return base64.b64decode(value).decode("utf-8")

          readme = Path("README.md")
          text = readme.read_text()
          old1 = decode("")
          new1 = decode("")
          old2 = decode("")
          new2 = decode("")
          if old1 not in text or old2 not in text:
              raise SystemExit("README reconciliation anchors were not found")
          text = text.replace(old1, new1).replace(old2, new2)
          retrieval = decode("VGhlIGV4aXN0aW5nIFJlbGVhc2UgMC454oCTMC4xMSBzeW50aGV0aWMgZXh0ZXJuYWwgcmV0cmlldmFsL3JlcGx5IGJyb3dzZXIgYWRhcHRlciByZXF1aXJlcyBib3RoIGRldmVsb3BtZW50IGdhdGVzOgoKYGBgc2gKU0VDVVJFX0VYQ0hBTkdFX1NZTlRIRVRJQ19ERU1PPWVuYWJsZWQgXApERU1PX0VYVEVSTkFMX1JFVFJJRVZBTF9FTkFCTEVEPWVuYWJsZWQgXApucG0gcnVuIGRldgpgYGAK")
          commercial = decode("")
          if "DEMO_COMMERCIAL_WORKFLOW_ENABLED=enabled" not in text:
              text = text.replace(retrieval, retrieval + commercial)
          focused = decode("")
          focused_add = decode("bnBtIHRlc3QgLS0gdGVzdHMvdW5pdC9zeW50aGV0aWMtY29tbWVyY2lhbC13b3JrZmxvdy50ZXN0LnRzIHRlc3RzL2ludGVncmF0aW9uL3N0YWZmLWF0dGFjaG1lbnQtcHJldmlldy50ZXN0LnRzIHRlc3RzL2ludGVncmF0aW9uL2NvbW1lcmNpYWwtZGV2ZWxvcG1lbnQtaHR0cC50ZXN0LnRzIHRlc3RzL2FyY2hpdGVjdHVyZS9jb21tZXJjaWFsLWRlbW8tYm91bmRhcnkudGVzdC50cwo=")
          if "synthetic-commercial-workflow.test.ts" not in text:
              text = text.replace(focused, focused + focused_add)
          link_old = decode("LSBbUmVsZWFzZSAwLjEzIOKAlCBCb290c3RyYXAgJiBCcm93c2VyIFNlc3Npb24gQ29yZV0oZG9jcy9yZWxlYXNlcy8wLjEzLWJvb3RzdHJhcC1zZXNzaW9uLWNvcmUubWQpCg==")
          link_new = decode("LSBbUmVsZWFzZSAwLjE0IOKAlCBTeW50aGV0aWMgQ29tbWVyY2lhbCBXb3JrZmxvdyBEZW1vXShkb2NzL3JlbGVhc2VzLzAuMTQtc3ludGhldGljLWNvbW1lcmNpYWwtd29ya2Zsb3ctZGVtby5tZCkKLSBbUmVsZWFzZSAwLjEzIOKAlCBCb290c3RyYXAgJiBCcm93c2VyIFNlc3Npb24gQ29yZV0oZG9jcy9yZWxlYXNlcy8wLjEzLWJvb3RzdHJhcC1zZXNzaW9uLWNvcmUubWQpCg==")
          if "0.14-synthetic-commercial-workflow-demo.md" not in text:
              text = text.replace(link_old, link_new)
          readme.write_text(text)

          append_payloads = {
              "docs/MVP_AND_ROADMAP.md": "",
              "docs/security/TEST_AND_SECURITY_STRATEGY.md": "",
              "docs/development/DEVELOPMENT.md": "",
          }
          markers = {
              "docs/MVP_AND_ROADMAP.md": "## Release 0.14 — Synthetic Provider-Augmented Commercial Workflow Demo",
              "docs/security/TEST_AND_SECURITY_STRATEGY.md": "## Release 0.14 synthetic commercial workflow regression boundary",
              "docs/development/DEVELOPMENT.md": "## Release 0.14 synthetic commercial workflow demo",
          }
          for filename, payload in append_payloads.items():
              path = Path(filename)
              current = path.read_text()
              if markers[filename] not in current:
                  path.write_text(current + decode(payload))
          PY
      - name: Apply repository formatter
        run: npm run format
      - name: Commit documentation reconciliation if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Release 0.14 documentation updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile Release 0.14 documentation"
          git push origin HEAD:release/0.14-synthetic-commercial-workflow-demo

