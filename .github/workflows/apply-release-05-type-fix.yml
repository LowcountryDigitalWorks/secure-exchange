name: Apply Release 0.5 type fix

on:
  push:
    branches:
      - release/0.5-local-development-vertical-slice

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply strict TypeScript corrections
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          function replaceRequired(path, before, after) {
            const source = readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${path}`);
            }
            writeFileSync(path, source.replace(before, after));
          }

          replaceRequired(
            'src/http/app.ts',
            `    if (demo === undefined) {\n      return context.notFound();\n    }\n    await next();\n  });`,
            `    if (demo === undefined) {\n      return context.notFound();\n    }\n    return next();\n  });`,
          );

          replaceRequired(
            'tests/integration/development-demo-http.test.ts',
            `): Promise<Response> {\n  return app.request(`,
            `): Response | Promise<Response> {\n  return app.request(`,
          );
          NODE
          npx --no-install prettier --write src/http/app.ts tests/integration/development-demo-http.test.ts
          npm run lint
          npm run typecheck
      - name: Commit type corrections
        shell: bash
        run: |
          if git diff --quiet -- src/http/app.ts tests/integration/development-demo-http.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/http/app.ts tests/integration/development-demo-http.test.ts
          git commit -m "Fix Release 0.5 strict TypeScript contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
