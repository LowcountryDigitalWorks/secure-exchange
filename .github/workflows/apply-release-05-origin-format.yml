name: Apply Release 0.5 origin format

on:
  push:
    branches:
      - release/0.5-local-development-vertical-slice

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Normalize and check same-origin correction
        run: |
          npx --no-install prettier --write src/http/app.ts
          npm run lint
          npm run typecheck
      - name: Commit normalized file
        shell: bash
        run: |
          if git diff --quiet -- src/http/app.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/http/app.ts
          git commit -m "Normalize Release 0.5 same-origin correction"
          git push origin HEAD:${GITHUB_REF_NAME}
