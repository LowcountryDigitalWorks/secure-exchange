              await expectApplicationCode(
                service.retrieveStaffAttachment({
                  actor: actorContext(),
                  deploymentId: DEPLOYMENT_A,
                  threadId: THREAD_A,
                  messageId: MESSAGE_A,
                  attachmentId: "attachment-seeded",
