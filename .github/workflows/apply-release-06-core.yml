              await content.put(item.contentRef, BYTES);
              content.failNextGet();
              await expectApplicationCode(
                service.retrieveStaffAttachment({
                  actor: actorContext(),
                  deploymentId: DEPLOYMENT_A,
                  threadId: THREAD_A,
                  messageId: MESSAGE_A,
                  attachmentId: item.attachmentId,
