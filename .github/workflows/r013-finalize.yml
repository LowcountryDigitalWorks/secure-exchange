name: Release 0.13 Finalizer

on:
  push:
    branches:
      - release/0.13-bootstrap-session-core

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.13-bootstrap-session-core
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic finalization
        run: |
          python .github/r013-finalize.py
          python .github/r013-behavior-fixes.py
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Format
        run: npm run format
      - name: Validate implementation before candidate commit
        run: npm run lint && npm run typecheck && npm run test && npm run build && npm run security:audit && npm run security:secrets
      - name: Commit permanent candidate
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git rm .github/workflows/r013-finalize.yml .github/r013-finalize.py .github/r013-behavior-fixes.py
          git add -A
          git commit -m "Finalize Release 0.13 bootstrap and session core"
          git push origin HEAD:release/0.13-bootstrap-session-core
