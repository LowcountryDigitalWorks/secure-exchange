name: Bump Release 0.3 package version

on:
  push:
    branches:
      - release/0.3-workflow-core-prototype

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Set Release 0.3 package metadata
        run: npm version 0.3.0 --no-git-tag-version --ignore-scripts
      - name: Commit package metadata only
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          git commit -m "Set Release 0.3 package version"
          git push origin HEAD:${GITHUB_REF_NAME}
