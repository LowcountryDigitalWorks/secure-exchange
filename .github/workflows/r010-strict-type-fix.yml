name: Release 0.10 Strict Type Finalizer

on:
  push:
    branches:
      - release/0.10-external-reply-core

permissions:
  contents: write

concurrency:
  group: release-0.10-strict-type-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.10-external-reply-core

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Apply exact strict corrections
        shell: python
        run: |
          from pathlib import Path

          store_path = Path("src/adapters/in-memory-workflow-store.ts")
          store_text = store_path.read_text()
          old = "current === undefined ||\n        current.deploymentId !== guard.deploymentId ||"
          new = "current?.deploymentId !== guard.deploymentId ||"
          if store_text.count(old) != 1:
              raise SystemExit("Expected exactly one store target")
          store_path.write_text(store_text.replace(old, new))

          test_path = Path("tests/integration/external-reply-authority-guard.test.ts")
          test_text = test_path.read_text()
          changes = [
              (
                  "private armedGrantId?: string;\n  private armedRevokedAt?: string;",
                  "private armedGrantId: string | undefined;\n  private armedRevokedAt: string | undefined;",
              ),
              (
                  "current === undefined || current.threadId !== mutation.threadId",
                  "current?.threadId !== mutation.threadId",
              ),
          ]
          for old, new in changes:
              if test_text.count(old) != 1:
                  raise SystemExit("Expected exactly one test target")
              test_text = test_text.replace(old, new)
          test_path.write_text(test_text)

      - name: Format corrected files
        run: npx --no-install prettier --write src/adapters/in-memory-workflow-store.ts tests/integration/external-reply-authority-guard.test.ts

      - name: Remove temporary workflows
        run: rm .github/workflows/r010-authority-guard-lint-fix.yml .github/workflows/r010-strict-type-fix.yml

      - name: Run complete validation
        run: npm run validate

      - name: Commit permanent correction only
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          git commit -m "Finalize Release 0.10 authority guard correction"
          git push origin HEAD:release/0.10-external-reply-core
