name: Apply Release 0.4 format and version

on:
  push:
    branches:
      - release/0.4-conversation-queue-core

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Set Release 0.4 package metadata
        run: npm version 0.4.0 --no-git-tag-version --ignore-scripts
      - name: Format Release 0.4 files
        run: >-
          npx --no-install prettier --write
          README.md
          docs/MVP_AND_ROADMAP.md
          docs/releases/0.4-conversation-queue-core.md
          docs/development/DEVELOPMENT.md
          docs/security/TEST_AND_SECURITY_STRATEGY.md
          package.json
          package-lock.json
          src/domain/errors.ts
          src/domain/types.ts
          src/domain/message.ts
          src/domain/queue.ts
          src/domain/thread.ts
          src/domain/evidence.ts
          src/domain/index.ts
          src/application/errors.ts
          src/application/ports.ts
          src/application/conversation-service.ts
          src/application/status.ts
          src/adapters/in-memory-workflow-store.ts
          src/web/page.ts
          tests/helpers/workflow-fixture.ts
          tests/integration/conversation-service.test.ts
          tests/integration/http.test.ts
          tests/unit/message.test.ts
          tests/unit/queue.test.ts
          tests/unit/thread-activity.test.ts
          tests/unit/status.test.ts
          tests/e2e/baseline.spec.ts
      - name: Commit normalized Release 0.4 files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/MVP_AND_ROADMAP.md docs/releases/0.4-conversation-queue-core.md docs/development/DEVELOPMENT.md docs/security/TEST_AND_SECURITY_STRATEGY.md package.json package-lock.json src/domain/errors.ts src/domain/types.ts src/domain/message.ts src/domain/queue.ts src/domain/thread.ts src/domain/evidence.ts src/domain/index.ts src/application/errors.ts src/application/ports.ts src/application/conversation-service.ts src/application/status.ts src/adapters/in-memory-workflow-store.ts src/web/page.ts tests/helpers/workflow-fixture.ts tests/integration/conversation-service.test.ts tests/integration/http.test.ts tests/unit/message.test.ts tests/unit/queue.test.ts tests/unit/thread-activity.test.ts tests/unit/status.test.ts tests/e2e/baseline.spec.ts
          git commit -m "Normalize Release 0.4 files"
          git push origin HEAD:${GITHUB_REF_NAME}
