name: Format Release 0.3

on:
  push:
    branches:
      - release/0.3-workflow-core-prototype

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Format only Release 0.3 files
        run: >-
          npx --no-install prettier --write
          src/adapters/in-memory-workflow-store.ts
          src/application/workflow-service.ts
          src/domain/errors.ts
          src/domain/evidence.ts
          src/domain/policy.ts
          tests/helpers/workflow-fixture.ts
          tests/integration/workflow-service.test.ts
          tests/unit/completion-policy.test.ts
          tests/unit/thread-lifecycle.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            src/adapters/in-memory-workflow-store.ts \
            src/application/workflow-service.ts \
            src/domain/errors.ts \
            src/domain/evidence.ts \
            src/domain/policy.ts \
            tests/helpers/workflow-fixture.ts \
            tests/integration/workflow-service.test.ts \
            tests/unit/completion-policy.test.ts \
            tests/unit/thread-lifecycle.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/adapters/in-memory-workflow-store.ts \
            src/application/workflow-service.ts \
            src/domain/errors.ts \
            src/domain/evidence.ts \
            src/domain/policy.ts \
            tests/helpers/workflow-fixture.ts \
            tests/integration/workflow-service.test.ts \
            tests/unit/completion-policy.test.ts \
            tests/unit/thread-lifecycle.test.ts
          git commit -m "Apply Release 0.3 formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
