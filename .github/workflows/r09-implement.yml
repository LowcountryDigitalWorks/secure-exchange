name: Release 0.9 Implement

on:
  push:
    branches:
      - release/0.9-external-retrieval-development-slice
    paths:
      - ".github/workflows/r09-implement.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.9-external-retrieval-development-slice
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Implement Release 0.9
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("src/application/external-attachment-retrieval-service.ts").write_text(r'''import type {
            AccessGrantId,
            AttachmentId,
            DeploymentId,
            MessageId,
            ThreadId,
          } from "../domain/index.js";
          import type { AccessGrantService } from "./access-grant-service.js";
          import { retrieveAuthorizedAttachment } from "./attachment-retrieval.js";
          import type { Clock } from "./clock.js";
          import { ApplicationError } from "./errors.js";
          import type { OpaqueIdGenerator } from "./id-generator.js";
          import type { WorkflowStore } from "./ports.js";
          import type { ProtectedContentStore } from "./protected-content.js";

          export interface RetrieveExternalAttachmentInput {
            readonly deploymentId: DeploymentId;
            readonly threadId: ThreadId;
            readonly messageId: MessageId;
            readonly attachmentId: AttachmentId;
            readonly grantId: AccessGrantId;
            readonly secret: string;
          }

          export interface ListExternalAttachmentCandidatesInput {
            readonly deploymentId: DeploymentId;
            readonly threadId: ThreadId;
            readonly grantId: AccessGrantId;
            readonly secret: string;
          }

          export interface ExternalAttachmentCandidate {
            readonly messageId: MessageId;
            readonly attachmentId: AttachmentId;
            readonly safeDownloadFilename: string;
            readonly normalizedMediaType: string;
            readonly byteLength: number;
          }

          export interface ExternalAttachmentRetrievalResult {
            readonly safeDownloadFilename: string;
            readonly normalizedMediaType: string;
            readonly byteLength: number;
            readonly content: Uint8Array;
          }

          export class ExternalAttachmentRetrievalService {
            constructor(
              private readonly store: WorkflowStore,
              private readonly contentStore: ProtectedContentStore,
              private readonly idGenerator: OpaqueIdGenerator,
              private readonly accessGrants: AccessGrantService,
              private readonly clock: Clock,
            ) {}

            async listExternalAttachmentCandidates(
              input: ListExternalAttachmentCandidatesInput,
            ): Promise<readonly ExternalAttachmentCandidate[]> {
              await this.accessGrants.validatePresentedAccessGrant({
                deploymentId: input.deploymentId,
                threadId: input.threadId,
                grantId: input.grantId,
                secret: input.secret,
                operation: "ATTACHMENT_READ",
              });

              try {
                const messages = await this.store.listMessages(
                  input.deploymentId,
                  input.threadId,
                );
                const candidates: ExternalAttachmentCandidate[] = [];

                for (const message of messages) {
                  if (
                    message.deploymentId !== input.deploymentId ||
                    message.threadId !== input.threadId
                  ) {
                    continue;
                  }

                  const attachments = await this.store.listAttachmentsForMessage(
                    input.deploymentId,
                    input.threadId,
                    message.messageId,
                  );
                  for (const attachment of attachments) {
                    if (
                      attachment.deploymentId === input.deploymentId &&
                      attachment.threadId === input.threadId &&
                      attachment.messageId === message.messageId &&
                      attachment.state === "CLEAN" &&
                      attachment.deletedAt === undefined
                    ) {
                      candidates.push({
                        messageId: message.messageId,
                        attachmentId: attachment.attachmentId,
                        safeDownloadFilename: attachment.safeDownloadFilename,
                        normalizedMediaType: attachment.normalizedMediaType,
                        byteLength: attachment.sizeBytes,
                      });
                    }
                  }
                }

                return candidates;
              } catch {
                throw this.externalAccessDenied();
              }
            }

            async retrieveExternalAttachment(
              input: RetrieveExternalAttachmentInput,
            ): Promise<ExternalAttachmentRetrievalResult> {
              const authority = await this.accessGrants.validatePresentedAccessGrant({
                deploymentId: input.deploymentId,
                threadId: input.threadId,
                grantId: input.grantId,
                secret: input.secret,
                operation: "ATTACHMENT_READ",
              });

              try {
                const result = await retrieveAuthorizedAttachment(
                  {
                    store: this.store,
                    contentStore: this.contentStore,
                    idGenerator: this.idGenerator,
                  },
                  {
                    deploymentId: input.deploymentId,
                    threadId: input.threadId,
                    messageId: input.messageId,
                    attachmentId: input.attachmentId,
                    at: this.currentTime(),
                    expectedThreadVersion: authority.threadVersion,
                    authority: {
                      actorRef: authority.externalParticipantRef,
                      actorKind: "EXTERNAL",
                      accessGrantId: authority.grantId,
                    },
                  },
                );

                return {
                  safeDownloadFilename: result.safeDownloadFilename,
                  normalizedMediaType: result.normalizedMediaType,
                  byteLength: result.byteLength,
                  content: result.content,
                };
              } catch {
                throw this.externalAccessDenied();
              }
            }

            private currentTime(): string {
              const now = this.clock.now();
              if (!Number.isFinite(Date.parse(now))) {
                throw new Error("Clock returned an invalid timestamp.");
              }
              return now;
            }

            private externalAccessDenied(): ApplicationError {
              return new ApplicationError(
                "EXTERNAL_ACCESS_DENIED",
                "External access is not available for the presented authority.",
              );
            }
          }
          ''')

          Path("src/http/development-demo.ts").write_text(r'''import { AccessGrantService } from "../application/access-grant-service.js";
          import { AttachmentService } from "../application/attachment-service.js";
          import type { Clock } from "../application/clock.js";
          import { ConversationService } from "../application/conversation-service.js";
          import { ExternalAttachmentRetrievalService } from "../application/external-attachment-retrieval-service.js";
          import type { OpaqueIdGenerator } from "../application/id-generator.js";
          import { WorkflowService } from "../application/workflow-service.js";
          import { InMemoryProtectedContentStore } from "../adapters/in-memory-protected-content-store.js";
          import { InMemoryWorkflowStore } from "../adapters/in-memory-workflow-store.js";
          import { WebCryptoAccessGrantSecretManager } from "../adapters/web-crypto-access-grant-secret.js";
          import { WebCryptoOpaqueIdGenerator } from "../adapters/web-crypto-id-generator.js";
          import type {
            AccessGrantPolicy,
            ActorContext,
            AttachmentFilePolicy,
            Queue,
          } from "../domain/index.js";

          export const SYNTHETIC_DEPLOYMENT_ID = "synthetic-development-deployment";
          export const SYNTHETIC_QUEUE_ID = "synthetic-development-queue";
          export const SYNTHETIC_STAFF_ACTOR_REF = "synthetic-development-staff";
          export const SYNTHETIC_SYSTEM_ACTOR_REF = "synthetic-development-system";
          export const SYNTHETIC_ACCESS_GRANT_POLICY_REF =
            "synthetic-development-access-policy-v1";
          export const SYNTHETIC_ATTACHMENT_POLICY_REF =
            "synthetic-development-attachment-policy-v1";

          export const SYNTHETIC_ROUTING_CHOICES = [
            { value: "GENERAL", label: "General" },
            { value: "RECORDS", label: "Records" },
          ] as const;

          export interface DevelopmentDemoRuntime {
            readonly store: InMemoryWorkflowStore;
            readonly contentStore: InMemoryProtectedContentStore;
            readonly conversationService: ConversationService;
            readonly workflowService: WorkflowService;
            readonly attachmentService: AttachmentService;
            readonly accessGrantService: AccessGrantService;
            readonly externalAttachmentRetrievalService: ExternalAttachmentRetrievalService;
            readonly idGenerator: OpaqueIdGenerator;
            readonly now: () => string;
            readonly deploymentId: string;
            readonly queueId: string;
            readonly queueLabel: string;
            readonly routingChoices: readonly {
              readonly value: string;
              readonly label: string;
            }[];
            readonly staffActor: ActorContext;
            readonly staffContextLabel: string;
          }

          export interface LocalDevelopmentDemoOptions {
            readonly idGenerator?: OpaqueIdGenerator;
            readonly now?: () => string;
            readonly queueActive?: boolean;
          }

          export function createLocalDevelopmentDemoRuntime(
            options: LocalDevelopmentDemoOptions = {},
          ): DevelopmentDemoRuntime {
            const queue: Queue = {
              queueId: SYNTHETIC_QUEUE_ID,
              deploymentId: SYNTHETIC_DEPLOYMENT_ID,
              active: options.queueActive ?? true,
              displayLabel: "Synthetic Intake Queue",
              allowedRoutingCategories: SYNTHETIC_ROUTING_CHOICES.map(
                (choice) => choice.value,
              ),
            };
            const staffActor: ActorContext = {
              actorRef: SYNTHETIC_STAFF_ACTOR_REF,
              deploymentId: SYNTHETIC_DEPLOYMENT_ID,
              actorKind: "STAFF",
            };
            const attachmentPolicy: AttachmentFilePolicy = {
              policyRef: SYNTHETIC_ATTACHMENT_POLICY_REF,
              deploymentId: SYNTHETIC_DEPLOYMENT_ID,
              maxAttachmentSizeBytes: 2 * 1024 * 1024,
              maxAttachmentsPerMessage: 4,
              allowedMediaCategories: ["DOCUMENT", "TEXT"],
              allowedMediaTypes: ["application/pdf", "text/plain"],
              allowedExtensions: ["pdf", "txt"],
            };
            const accessGrantPolicy: AccessGrantPolicy = {
              policyRef: SYNTHETIC_ACCESS_GRANT_POLICY_REF,
              deploymentId: SYNTHETIC_DEPLOYMENT_ID,
              maxLifetimeSeconds: 3_600,
              allowedOperations: ["THREAD_READ", "ATTACHMENT_READ"],
            };
            const store = new InMemoryWorkflowStore({
              queues: [queue],
              attachmentPolicies: [attachmentPolicy],
              accessGrantPolicies: [accessGrantPolicy],
              actorAuthorizations: [
                {
                  ...staffActor,
                  active: true,
                  allowedQueueIds: [SYNTHETIC_QUEUE_ID],
                  permissions: [
                    "QUEUE_LIST",
                    "THREAD_OPEN",
                    "THREAD_REPLY",
                    "THREAD_TRANSITION",
                    "ATTACHMENT_READ",
                    "ACCESS_GRANT_ISSUE",
                    "ACCESS_GRANT_REVOKE",
                  ],
                },
              ],
            });
            const contentStore = new InMemoryProtectedContentStore();
            const idGenerator =
              options.idGenerator ?? new WebCryptoOpaqueIdGenerator();
            const now = options.now ?? (() => new Date().toISOString());
            const clock: Clock = { now };
            const accessGrantService = new AccessGrantService(
              store,
              idGenerator,
              new WebCryptoAccessGrantSecretManager(),
              clock,
            );

            return {
              store,
              contentStore,
              conversationService: new ConversationService(store),
              workflowService: new WorkflowService(store),
              attachmentService: new AttachmentService(
                store,
                contentStore,
                idGenerator,
                SYNTHETIC_SYSTEM_ACTOR_REF,
              ),
              accessGrantService,
              externalAttachmentRetrievalService:
                new ExternalAttachmentRetrievalService(
                  store,
                  contentStore,
                  idGenerator,
                  accessGrantService,
                  clock,
                ),
              idGenerator,
              now,
              deploymentId: SYNTHETIC_DEPLOYMENT_ID,
              queueId: SYNTHETIC_QUEUE_ID,
              queueLabel: queue.displayLabel,
              routingChoices: SYNTHETIC_ROUTING_CHOICES,
              staffActor,
              staffContextLabel: "Synthetic Staff Context",
            };
          }
          ''')

          Path("src/http/external-retrieval-development.ts").write_text(r'''import type { Context, Hono } from "hono";

          import type { AccessGrantOperation } from "../domain/index.js";
          import {
            renderExternalAccessForm,
            renderExternalAccessSession,
            renderExternalAccessUnavailable,
            renderExternalAttachmentCandidates,
            renderExternalConversationPage,
          } from "../web/page.js";
          import type { DevelopmentDemoRuntime } from "./development-demo.js";

          export const EXTERNAL_RETRIEVAL_ROUTE_PREFIX = "/demo/external/access";
          export const EXTERNAL_CAPABILITY_COOKIE_NAME =
            "sx_demo_external_capability";
          export const EXTERNAL_CAPABILITY_MAX_AGE_SECONDS = 600;

          interface ExternalBrowserCapability {
            readonly threadId: string;
            readonly grantId: string;
            readonly secret: string;
          }

          function hasControlCharacters(value: string): boolean {
            for (const character of value) {
              const codePoint = character.codePointAt(0);
              if (
                codePoint !== undefined &&
                (codePoint < 0x20 || codePoint === 0x7f)
              ) {
                return true;
              }
            }
            return false;
          }

          function boundedValue(value: unknown, maxLength: number): value is string {
            return (
              typeof value === "string" &&
              value.length > 0 &&
              value.length <= maxLength &&
              !hasControlCharacters(value)
            );
          }

          function isSameOriginPost(request: Request): boolean {
            const fetchSite = request.headers.get("Sec-Fetch-Site");
            if (fetchSite !== null) {
              return fetchSite === "same-origin";
            }

            const origin = request.headers.get("Origin");
            if (origin === null) {
              return false;
            }

            try {
              const parsedOrigin = new URL(origin);
              if (
                parsedOrigin.protocol !== "http:" &&
                parsedOrigin.protocol !== "https:"
              ) {
                return false;
              }

              const requestHost = request.headers.get("Host");
              if (requestHost !== null) {
                return parsedOrigin.host === requestHost;
              }

              return parsedOrigin.origin === new URL(request.url).origin;
            } catch {
              return false;
            }
          }

          function capabilityCookieValue(
            capability: ExternalBrowserCapability,
          ): string {
            return encodeURIComponent(JSON.stringify(capability));
          }

          function capabilityCookie(
            capability: ExternalBrowserCapability,
            request: Request,
          ): string {
            const secure = new URL(request.url).protocol === "https:";
            return `${EXTERNAL_CAPABILITY_COOKIE_NAME}=${capabilityCookieValue(capability)}; Path=${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}; Max-Age=${EXTERNAL_CAPABILITY_MAX_AGE_SECONDS}; HttpOnly; SameSite=Strict${secure ? "; Secure" : ""}`;
          }

          function clearCapabilityCookie(request: Request): string {
            const secure = new URL(request.url).protocol === "https:";
            return `${EXTERNAL_CAPABILITY_COOKIE_NAME}=; Path=${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict${secure ? "; Secure" : ""}`;
          }

          function readCapability(
            request: Request,
          ): ExternalBrowserCapability | undefined {
            const cookieHeader = request.headers.get("Cookie");
            if (cookieHeader === null) {
              return undefined;
            }

            const prefix = `${EXTERNAL_CAPABILITY_COOKIE_NAME}=`;
            const encoded = cookieHeader
              .split(";")
              .map((part) => part.trim())
              .find((part) => part.startsWith(prefix))
              ?.slice(prefix.length);
            if (encoded === undefined || encoded.length > 3_800) {
              return undefined;
            }

            try {
              const parsed: unknown = JSON.parse(decodeURIComponent(encoded));
              if (typeof parsed !== "object" || parsed === null) {
                return undefined;
              }
              const candidate = parsed as Record<string, unknown>;
              if (
                !boundedValue(candidate["threadId"], 256) ||
                !boundedValue(candidate["grantId"], 256) ||
                !boundedValue(candidate["secret"], 512)
              ) {
                return undefined;
              }
              return {
                threadId: candidate["threadId"],
                grantId: candidate["grantId"],
                secret: candidate["secret"],
              };
            } catch {
              return undefined;
            }
          }

          async function validatesForAnyOperation(
            demo: DevelopmentDemoRuntime,
            capability: ExternalBrowserCapability,
          ): Promise<boolean> {
            const operations: readonly AccessGrantOperation[] = [
              "THREAD_READ",
              "ATTACHMENT_READ",
            ];
            for (const operation of operations) {
              try {
                await demo.accessGrantService.validatePresentedAccessGrant({
                  deploymentId: demo.deploymentId,
                  threadId: capability.threadId,
                  grantId: capability.grantId,
                  secret: capability.secret,
                  operation,
                });
                return true;
              } catch {
                // The observable result remains one generic denial.
              }
            }
            return false;
          }

          function unavailable(context: Context, clear = false): Response {
            if (clear) {
              context.header(
                "Set-Cookie",
                clearCapabilityCookie(context.req.raw),
              );
            }
            return context.html(renderExternalAccessUnavailable(), 403);
          }

          async function protectedUnavailable(
            context: Context,
            demo: DevelopmentDemoRuntime,
            capability: ExternalBrowserCapability | undefined,
          ): Promise<Response> {
            const shouldClear =
              capability === undefined ||
              !(await validatesForAnyOperation(demo, capability));
            return unavailable(context, shouldClear);
          }

          function parseCredentialForm(
            form: FormData,
          ): ExternalBrowserCapability | undefined {
            const threadId = form.get("threadId");
            const grantId = form.get("grantId");
            const secret = form.get("accessSecret");
            if (
              !boundedValue(threadId, 256) ||
              !boundedValue(grantId, 256) ||
              !boundedValue(secret, 512)
            ) {
              return undefined;
            }
            return { threadId, grantId, secret };
          }

          export function buildAttachmentContentDisposition(filename: string): string {
            const sanitized = filename
              .replace(/[\r\n"\\]/gu, "_")
              .replace(/[^\x20-\x7e]/gu, "_")
              .slice(0, 120);
            return `attachment; filename="${sanitized.length === 0 ? "attachment" : sanitized}"`;
          }

          export function registerExternalRetrievalDevelopmentRoutes(
            app: Hono,
            demo: DevelopmentDemoRuntime,
          ): void {
            app.get(EXTERNAL_RETRIEVAL_ROUTE_PREFIX, (context) =>
              context.html(renderExternalAccessForm()),
            );

            app.post(EXTERNAL_RETRIEVAL_ROUTE_PREFIX, async (context) => {
              if (!isSameOriginPost(context.req.raw)) {
                return unavailable(context, true);
              }

              try {
                const capability = parseCredentialForm(
                  await context.req.raw.formData(),
                );
                if (
                  capability === undefined ||
                  !(await validatesForAnyOperation(demo, capability))
                ) {
                  return unavailable(context, true);
                }

                context.header(
                  "Set-Cookie",
                  capabilityCookie(capability, context.req.raw),
                );
                return context.redirect(
                  `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/session`,
                  303,
                );
              } catch {
                return unavailable(context, true);
              }
            });

            app.get(`${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/session`, async (context) => {
              const capability = readCapability(context.req.raw);
              if (
                capability === undefined ||
                !(await validatesForAnyOperation(demo, capability))
              ) {
                return unavailable(context, true);
              }
              return context.html(renderExternalAccessSession());
            });

            app.get(
              `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/conversation`,
              async (context) => {
                const capability = readCapability(context.req.raw);
                if (capability === undefined) {
                  return unavailable(context, true);
                }

                try {
                  const conversation =
                    await demo.accessGrantService.retrieveExternalConversation({
                      deploymentId: demo.deploymentId,
                      threadId: capability.threadId,
                      grantId: capability.grantId,
                      secret: capability.secret,
                    });
                  return context.html(
                    renderExternalConversationPage(conversation),
                  );
                } catch {
                  return protectedUnavailable(context, demo, capability);
                }
              },
            );

            app.get(
              `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/attachments`,
              async (context) => {
                const capability = readCapability(context.req.raw);
                if (capability === undefined) {
                  return unavailable(context, true);
                }

                try {
                  const candidates =
                    await demo.externalAttachmentRetrievalService.listExternalAttachmentCandidates(
                      {
                        deploymentId: demo.deploymentId,
                        threadId: capability.threadId,
                        grantId: capability.grantId,
                        secret: capability.secret,
                      },
                    );
                  return context.html(
                    renderExternalAttachmentCandidates(candidates),
                  );
                } catch {
                  return protectedUnavailable(context, demo, capability);
                }
              },
            );

            app.post(
              `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/download`,
              async (context) => {
                if (!isSameOriginPost(context.req.raw)) {
                  return unavailable(context);
                }
                const capability = readCapability(context.req.raw);
                if (capability === undefined) {
                  return unavailable(context, true);
                }

                try {
                  const form = await context.req.raw.formData();
                  const messageId = form.get("messageId");
                  const attachmentId = form.get("attachmentId");
                  if (
                    !boundedValue(messageId, 256) ||
                    !boundedValue(attachmentId, 256)
                  ) {
                    return unavailable(context);
                  }

                  const result =
                    await demo.externalAttachmentRetrievalService.retrieveExternalAttachment(
                      {
                        deploymentId: demo.deploymentId,
                        threadId: capability.threadId,
                        messageId,
                        attachmentId,
                        grantId: capability.grantId,
                        secret: capability.secret,
                      },
                    );
                  context.header("Content-Type", result.normalizedMediaType);
                  context.header("Content-Length", String(result.byteLength));
                  context.header(
                    "Content-Disposition",
                    buildAttachmentContentDisposition(
                      result.safeDownloadFilename,
                    ),
                  );
                  context.header("Cache-Control", "no-store, private");
                  context.header("X-Content-Type-Options", "nosniff");
                  context.header("Referrer-Policy", "no-referrer");
                  context.header("Cross-Origin-Resource-Policy", "same-origin");
                  return context.body(Uint8Array.from(result.content).buffer);
                } catch {
                  return protectedUnavailable(context, demo, capability);
                }
              },
            );

            app.post(
              `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/end`,
              async (context) => {
                if (!isSameOriginPost(context.req.raw)) {
                  return unavailable(context);
                }
                context.header(
                  "Set-Cookie",
                  clearCapabilityCookie(context.req.raw),
                );
                return context.redirect(EXTERNAL_RETRIEVAL_ROUTE_PREFIX, 303);
              },
            );
          }
          ''')

          app_path = "src/http/app.ts"
          replace_once(
              app_path,
              'import { Hono } from "hono";\n\n',
              'import { Hono } from "hono";\n\nimport { registerExternalRetrievalDevelopmentRoutes } from "./external-retrieval-development.js";\n',
          )
          replace_once(
              app_path,
              'export interface CreateAppOptions {\n  readonly demo?: DevelopmentDemoRuntime;\n}',
              'export interface CreateAppOptions {\n  readonly demo?: DevelopmentDemoRuntime;\n  readonly externalRetrievalEnabled?: boolean;\n}',
          )
          replace_once(
              app_path,
              '  const demo = options.demo;\n  const demoEnabled = demo !== undefined;\n  const app = new Hono();',
              '  const demo = options.demo;\n  const demoEnabled = demo !== undefined;\n  const externalRetrievalEnabled =\n    demoEnabled && options.externalRetrievalEnabled === true;\n  const app = new Hono();',
          )
          replace_once(
              app_path,
              '  if (demo !== undefined) {\n    const rejectCrossSitePost',
              '  if (demo !== undefined) {\n    if (externalRetrievalEnabled) {\n      registerExternalRetrievalDevelopmentRoutes(app, demo);\n    }\n\n    const rejectCrossSitePost',
          )

          Path("src/server.ts").write_text(r'''import { serve } from "@hono/node-server";

          import { createApp } from "./http/app.js";
          import { createLocalDevelopmentDemoRuntime } from "./http/development-demo.js";

          const DEFAULT_PORT = 3000;
          const parsedPort = Number.parseInt(
            process.env["PORT"] ?? String(DEFAULT_PORT),
            10,
          );

          if (!Number.isInteger(parsedPort) || parsedPort < 1 || parsedPort > 65_535) {
            throw new Error("PORT must be an integer between 1 and 65535.");
          }

          const demoEnabled =
            process.env["SECURE_EXCHANGE_SYNTHETIC_DEMO"] === "enabled";
          const externalRetrievalEnabled =
            demoEnabled &&
            process.env["DEMO_EXTERNAL_RETRIEVAL_ENABLED"] === "enabled";
          const app = createApp({
            ...(demoEnabled ? { demo: createLocalDevelopmentDemoRuntime() } : {}),
            ...(externalRetrievalEnabled ? { externalRetrievalEnabled: true } : {}),
          });

          serve({
            fetch: app.fetch,
            port: parsedPort,
          });

          console.log(
            `Secure Exchange local development server listening on port ${parsedPort}; synthetic demo ${demoEnabled ? "enabled" : "disabled"}; external retrieval development slice ${externalRetrievalEnabled ? "enabled" : "disabled"}.`,
          );
          ''')

          page_path = "src/web/page.ts"
          replace_once(
              page_path,
              'import type {\n  ConversationReadModel,\n  QueueCandidate,\n} from "../application/conversation-service.js";\n',
              'import type { ExternalConversationProjection } from "../application/access-grant-service.js";\nimport type {\n  ConversationReadModel,\n  QueueCandidate,\n} from "../application/conversation-service.js";\nimport type { ExternalAttachmentCandidate } from "../application/external-attachment-retrieval-service.js";\n',
          )
          replace_once(
              page_path,
              'select,\ntextarea {\n  width: 100%;\n  padding: 0.7rem;\n}',
