name: Release 0.9 Final Pass

on:
  push:
    branches:
      - release/0.9-external-retrieval-development-slice
    paths:
      - ".github/workflows/r09-final-pass.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.9-external-retrieval-development-slice
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Regenerate Release 0.9 candidate
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/r09-implement.yml").read_text()
          start_marker = "      - name: Implement Release 0.9\n        shell: python\n        run: |\n"
          end_marker = "      - name: Advance release metadata\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError("Could not locate Release 0.9 generator in temporary workflow.")
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), "r09-generator", "exec"))
      - name: Advance release metadata
        run: npm version 0.9.0 --no-git-tag-version --ignore-scripts
      - name: Apply validation diagnostics
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/http/external-retrieval-development.ts")
          text = path.read_text()
          old = '    `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/end`,\n    async (context) => {'
          new = '    `${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}/end`,\n    (context) => {'
          if old not in text:
              raise RuntimeError("Expected end-access async callback not found.")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/e2e/external-retrieval.spec.ts")
          text = path.read_text()
          text = text.replace('import type { AddressInfo } from "node:net";\n', "", 1)
          replacements = [
              ('${(address as AddressInfo).port}', '${address.port}'),
              ('const cookies = await page.context().cookies(baseURL);', 'const cookies = await page.context().cookies(`${baseURL}${EXTERNAL_RETRIEVAL_ROUTE_PREFIX}`);'),
              ('page.getByRole("link", { name: "Attachments" }).click()', 'page.getByRole("link", { name: "Attachments", exact: true }).click()'),
              ('page.getByRole("link", { name: "Conversation" }).click()', 'page.getByRole("link", { name: "Conversation", exact: true }).click()'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f"Expected browser diagnostic target not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("tests/helpers/external-demo-fixture.ts")
          text = path.read_text()
          old = '    readonly cookie?: string;'
          new = '    readonly cookie?: string | undefined;'
          if old not in text:
              raise RuntimeError("Expected test-helper cookie option not found.")
          path.write_text(text.replace(old, new, 1))
      - name: Format implementation
        run: npx --no-install prettier --write src tests docs package.json package-lock.json
      - name: Remove temporary implementation workflows
        run: rm .github/workflows/r09-implement.yml .github/workflows/r09-rerun.yml .github/workflows/r09-finalize.yml .github/workflows/r09-browser-finalize.yml .github/workflows/r09-final-pass.yml
      - name: Validate release tree
        run: npm run validate
      - name: Commit permanent Release 0.9 changes
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          git commit -m "Implement Release 0.9 external retrieval development slice"
          git push origin HEAD:release/0.9-external-retrieval-development-slice
