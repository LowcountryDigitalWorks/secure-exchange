name: Release 0.10 Finalize

on:
  push:
    branches:
      - release/0.10-external-reply-core

permissions:
  contents: write

concurrency:
  group: release-0.10-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.10-external-reply-core
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Document Release 0.10
        shell: python
        run: |
          from pathlib import Path

          sections = {
              "docs/MVP_AND_ROADMAP.md": """
          ## Release 0.10 — External Reply Core Prototype

          Release 0.10 adds provider-neutral AccessGrant-authorized external reply as an application/domain capability only. `THREAD_REPLY` is an explicit third AccessGrant operation alongside `THREAD_READ` and `ATTACHMENT_READ`; each authority remains independent and the current AccessGrant policy must explicitly permit every requested operation.

          External reply is allowed only while the authoritative thread is `NEW`, `IN_PROGRESS`, `AWAITING_EXTERNAL`, or `AWAITING_STAFF`. It fails closed while `COMPLETED`, `EXPIRED`, or `DISPOSED`. This is intentionally narrower than external read eligibility: a valid `THREAD_READ` grant may still read a `COMPLETED` conversation, but `THREAD_REPLY` cannot reply to it.

          A successful external reply creates one immutable `EXTERNAL_TO_STAFF` plain-text message attributed to the AccessGrant's authoritative external participant. It advances thread activity and staff-attention timestamps without creating per-user unread/read-receipt state and without automatically changing lifecycle state. Browser reply delivery remains deferred to Release 0.11.
          """,
              "docs/architecture/DOMAIN_MODEL.md": """
          ## Release 0.10 external reply semantics

          `AccessGrantOperation` now has exactly three explicit values: `THREAD_READ`, `ATTACHMENT_READ`, and `THREAD_REPLY`. There is no wildcard or aggregate access operation, and existing grants do not silently acquire reply authority.

          External reply eligibility is an explicit lifecycle rule separate from external read eligibility. `NEW`, `IN_PROGRESS`, `AWAITING_EXTERNAL`, and `AWAITING_STAFF` are replyable. `COMPLETED`, `EXPIRED`, and `DISPOSED` are not. `COMPLETED` remains readable when a valid grant separately carries `THREAD_READ`.

          A successful external reply creates one immutable `EXTERNAL_TO_STAFF` message whose actor reference is the AccessGrant's authoritative opaque `externalParticipantRef`. The caller cannot select actor identity, actor kind, deployment identity, message ID, audit ID, or authoritative timestamp. The existing bounded `PLAIN_TEXT` message representation remains authoritative for the body.

          External reply does not transition lifecycle. It updates `updatedAt` and `lastActivityAt` for authoritative activity and advances `attentionAt` to reflect new external activity requiring staff attention. `attentionAt` is not a per-user unread marker or read receipt and does not assert that every staff user has not read the message.
          """,
              "docs/architecture/ACCESS_PATTERNS.md": """
          ## Release 0.10 external reply access pattern

          AccessGrant issuance may include `THREAD_REPLY` only when the current AccessGrant policy explicitly permits it and the authoritative thread is currently reply-eligible. If a requested grant includes reply authority while the thread is `COMPLETED`, `EXPIRED`, or `DISPOSED`, issuance fails rather than silently removing the operation.

          Every reply use revalidates the presented bearer against the persisted verifier, deployment/thread scope, explicit `THREAD_REPLY`, revocation, authoritative server-time expiry, current broad external-access eligibility, and the stricter external-reply lifecycle rule. The caller never supplies the external actor; attribution comes only from the authoritative grant.

          Reply commits one immutable message, the expected-version thread activity/attention update, and minimized `MESSAGE_APPENDED` evidence in the same `WorkflowStore` mutation. A stale concurrent thread mutation fails the reply without partial message or audit publication. `THREAD_READ`, `ATTACHMENT_READ`, and `THREAD_REPLY` remain independent candidate/use paths; no identifier, prior validity, browser control, or index row grants authority.
          """,
              "docs/architecture/DATA_FLOW.md": """
          ## Release 0.10 external reply application flow

          1. The caller presents deployment/thread/grant selectors, the raw AccessGrant bearer secret, and a bounded plain-text reply body to the application service.
          2. Existing AccessGrant validation proves the verifier, deployment/thread scope, explicit `THREAD_REPLY`, unrevoked state, authoritative server-time expiry, and current broad external-access eligibility.
          3. The application separately enforces external-reply lifecycle eligibility: `NEW`, `IN_PROGRESS`, `AWAITING_EXTERNAL`, and `AWAITING_STAFF` only. `COMPLETED`, `EXPIRED`, and `DISPOSED` fail closed.
          4. The application derives the external actor from the grant's authoritative `externalParticipantRef`, validates the existing plain-text body rules, and generates message/audit identifiers plus timestamp server-side.
          5. The thread activity update advances `updatedAt`, `lastActivityAt`, and `attentionAt` to the new external activity time without changing lifecycle state or creating unread/read-receipt semantics.
          6. One expected-version `WorkflowStore` mutation atomically publishes the immutable `EXTERNAL_TO_STAFF` message, updated thread, and minimized `MESSAGE_APPENDED` evidence. A stale or failed commit publishes none of the reply artifacts.

          No reply creates `THREAD_OPENED`, `ATTACHMENT_DOWNLOADED`, TransferAttestation, completion evidence, or an automatic lifecycle transition. Browser reply delivery is not part of this release.
          """,
              "docs/security/AUTHORIZATION.md": """
          ## Release 0.10 external reply authorization

          AccessGrant external authority now uses three independent operations: `THREAD_READ`, `ATTACHMENT_READ`, and `THREAD_REPLY`. The current policy must explicitly permit `THREAD_REPLY` before issuance can include it. A grant carrying only read or attachment authority cannot reply, and a reply-only grant gains neither read nor attachment authority.

          Reply issuance additionally requires the current authoritative thread to be reply-eligible. At use time, the application revalidates the bearer verifier, deployment/thread scope, explicit reply operation, revocation, authoritative expiry, broad external-access eligibility, and the stricter reply lifecycle rule. `COMPLETED` remains readable with valid `THREAD_READ` authority but cannot accept external replies.

          External actor attribution comes only from the validated grant's opaque `externalParticipantRef`. Caller-provided body text, email/display name, IP address, browser fields, or extra request properties cannot select or override actor identity, actor kind, deployment, message ID, audit actor, or timestamp. Unsafe external failures remain collapsed to conservative `EXTERNAL_ACCESS_DENIED` behavior.
          """,
              "docs/security/THREAT_MODEL.md": """
          ## Release 0.10 external reply threats

          Release 0.10 explicitly addresses operation-confusion/privilege broadening, stale grant use after lifecycle change, external actor spoofing, sensitive reply-body leakage, and partial publication during concurrent mutation.

          Controls include a distinct `THREAD_REPLY` operation with policy opt-in, use-time bearer/scope/revocation/expiry revalidation, a separate domain reply-state rule that excludes `COMPLETED`, grant-derived external actor attribution, bounded plain-text validation, server-generated identifiers/time, minimized audit with no body/secret/verifier, and expected-version atomic message/thread/audit commit.

          `attentionAt` records staff-facing attention to new external activity only; it is not a global unread/read-receipt assertion. Release 0.10 adds no browser reply route, upload capability, email bootstrap, public deployment, production identity/session, or cloud infrastructure; those delivery/abuse controls remain later trust-boundary work.
          """,
              "docs/security/TEST_AND_SECURITY_STRATEGY.md": """
          ## Release 0.10 external reply regression requirements

          Deterministic unit coverage proves the explicit reply lifecycle matrix and external activity/attention version semantics. Integration coverage proves `THREAD_REPLY` is independent from read/attachment authority; reply-only and mixed grants; policy rejection; wrong-secret/revoked/expired/wrong-scope denial; grant-ID-without-secret denial; authoritative grant actor attribution; all four allowed and all three denied lifecycle states; active-grant denial after completion; bounded plain-text validation; immutable chronological external messages; minimized audit; no lifecycle/download/open/TransferAttestation/completion inference; transaction rollback; and stale concurrent expected-version failure without partial publication.

          Existing staff-reply behavior and all Release 0.7–0.9 AccessGrant, attachment, browser, accessibility, secret, dependency, workflow, and evidence regressions remain part of `npm run validate`. Release 0.10 deliberately adds no browser reply surface, so the existing browser suite remains regression coverage rather than a reply-delivery test.
          """,
              "docs/development/DEVELOPMENT.md": """
          ## Release 0.10 external reply development boundary

          `AccessGrantService.replyExternalConversation()` is an application-only operation. Its untrusted input is limited to deployment/thread/grant selectors, the presented raw bearer secret, and bounded plain-text reply body. The service derives external actor attribution from the validated grant and generates message/audit IDs plus time through existing application boundaries.

          External replies are allowed only in `NEW`, `IN_PROGRESS`, `AWAITING_EXTERNAL`, and `AWAITING_STAFF`. They do not change lifecycle state. They advance `lastActivityAt` and `attentionAt` to represent new external activity requiring staff attention; `attentionAt` is not per-user unread/read-receipt state.

          Do not add an HTTP `/reply` route, reply form/button, client JavaScript, browser upload, email delivery, production authentication/session, or cloud adapter as part of Release 0.10. Release 0.11 must separately review browser reply delivery and same-origin/capability-cookie behavior. No dependency is added in this release.
          """,
          }

          for raw_path, section in sections.items():
              path = Path(raw_path)
              text = path.read_text()
              normalized = section.strip() + "\n"
              marker = normalized.splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + "\n\n" + normalized)

          release = Path("docs/releases/0.10-external-reply-core.md")
          release.write_text("""# Release 0.10 — External Reply Core Prototype

          ## Scope

          Release 0.10 adds provider-neutral AccessGrant-authorized external reply in the domain/application layer with synthetic/local persistence only. It adds no browser reply form/API, email delivery, external attachment upload, production authentication, cloud infrastructure, customer data, PHI, analytics, or paid service.

          ## Explicit AccessGrant authority

          The AccessGrant operation vocabulary is exactly `THREAD_READ`, `ATTACHMENT_READ`, and `THREAD_REPLY`. Operations are independent; no wildcard exists and existing grants do not silently gain reply authority. The current AccessGrant policy must explicitly permit every requested operation.

          If issuance includes `THREAD_REPLY`, the current authoritative thread must also be reply-eligible. Reply authority is never silently removed from an otherwise requested mixed grant.

          ## Reply lifecycle

          External reply is allowed only in `NEW`, `IN_PROGRESS`, `AWAITING_EXTERNAL`, and `AWAITING_STAFF`. It is denied in `COMPLETED`, `EXPIRED`, and `DISPOSED`. This rule is separate from broad external read eligibility: a valid `THREAD_READ` grant may read `COMPLETED`, while `THREAD_REPLY` cannot reply there.

          A reply never automatically transitions lifecycle. In particular, `AWAITING_EXTERNAL` remains `AWAITING_EXTERNAL` unless an explicit workflow action changes it.

          ## Application and actor boundary

          `AccessGrantService.replyExternalConversation()` accepts only deployment/thread/grant selectors, bearer secret, and bounded plain-text body. It reuses the existing AccessGrant verifier/scope/revocation/expiry/current-thread validation with explicit `THREAD_REPLY`, then applies the stricter reply lifecycle rule.

          The immutable reply message is `EXTERNAL_TO_STAFF`. Actor attribution comes only from the authoritative grant's opaque `externalParticipantRef`. Message ID, audit ID, actor kind, and timestamp are generated or supplied through trusted server-side application boundaries, not by the external caller.

          ## Activity, attention, and atomicity

          New external activity advances `updatedAt`, `lastActivityAt`, and `attentionAt` to the reply timestamp while preserving lifecycle. `attentionAt` means staff-facing attention is warranted by newer external activity; it does not mean every staff user is unread and it is not a read receipt.

          The new message, expected-version thread activity/attention update, and minimized `MESSAGE_APPENDED` audit event commit atomically through `WorkflowStore`. Stale or failed commits publish none of those reply artifacts.

          ## Audit minimization

          Successful reply evidence may contain opaque event/deployment/thread/external actor/message/grant identifiers, actor kind `EXTERNAL`, timestamp, and bounded success outcome. It does not contain the message body, bearer secret, verifier, unrestricted external contact information, browser cookie/request body, TransferAttestation, or completion event.

          ## Browser boundary

          Release 0.9 browser retrieval remains unchanged. Release 0.10 adds no `/reply` route, reply form, reply button, reply API, or client JavaScript. Browser reply delivery, capability-cookie use, same-origin controls, abuse controls, and production bootstrap remain Release 0.11/later decisions.

          ## Dependencies and cost

          No runtime or development dependency is added or changed. Package metadata advances to `0.10.0`. New recurring cost is **$0**.
          """.strip() + "\n")

      - name: Advance release metadata
        run: npm version 0.10.0 --no-git-tag-version --ignore-scripts

      - name: Format release changes
        run: npx --no-install prettier --write src tests docs package.json package-lock.json

      - name: Remove temporary finalizer
        run: rm .github/workflows/r010-finalize.yml

      - name: Run complete validation
        run: npm run validate

      - name: Commit permanent Release 0.10 changes
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add -A
          git commit -m "Finalize Release 0.10 external reply core"
          git push origin HEAD:release/0.10-external-reply-core
