name: Release 0.8 Finalize

on:
  push:
    branches:
      - release/0.8-external-attachment-retrieval
    paths:
      - ".github/workflows/r08-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.8-external-attachment-retrieval
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Reconcile Release 0.8 documentation
        shell: python
        run: |
          from pathlib import Path

          sections = {
              "docs/MVP_AND_ROADMAP.md": r'''
          ## Release 0.8 — external attachment retrieval core

          Release 0.8 adds provider-neutral external attachment retrieval behind explicit `ATTACHMENT_READ` AccessGrant authority. `THREAD_READ` and `ATTACHMENT_READ` remain independent capabilities: neither implies the other, and current AccessGrant policy must explicitly permit every operation requested at issuance.

          The browser-delivery trust boundary remains deferred. Release 0.8 adds no public grant URL, email delivery, capability cookie, public attachment endpoint, or external reply surface. A later release must separately review delivery of the bearer credential and HTTP response controls.

          External attachment download remains evidence only: `Opened != Downloaded != Transferred/Filed != Completed`. Download does not create TransferAttestation and does not complete or otherwise transition a thread.
          ''',
              "docs/architecture/DOMAIN_MODEL.md": r'''
          ## Release 0.8 AccessGrant attachment authority

          `AccessGrantOperation` now has two explicit values: `THREAD_READ` and `ATTACHMENT_READ`. They are independent scoped authorities; there is no wildcard or unrestricted operation. Existing thread-read authority never implies attachment-read authority.

          Staff and external attachment retrieval use different authority sources but converge on one application safety invariant after authorization. Staff authority comes from current authenticated staff authorization plus queue scope and staff `ATTACHMENT_READ` permission. External authority comes from a currently valid, thread-scoped AccessGrant whose explicit operation is `ATTACHMENT_READ`.

          The shared retrieval invariant authoritatively verifies message scope, attachment deployment/thread/message ownership, exactly `CLEAN` state with no deletion marker, protected-content availability, and byte-length equality with authoritative attachment metadata before `ATTACHMENT_DOWNLOADED` may be committed.
          ''',
              "docs/architecture/ACCESS_PATTERNS.md": r'''
          ## Release 0.8 external attachment access pattern

          External attachment retrieval requires an authoritative AccessGrant lookup and verifier check for the same deployment and thread with explicit `ATTACHMENT_READ`. The grant must be unrevoked, unexpired according to server time, and the current authoritative thread must remain externally eligible.

          After external authority is established, the retrieval path converges with staff retrieval: load the authoritative message, load the attachment, verify deployment/thread/message ownership, require state exactly `CLEAN` and not deleted, resolve protected content, verify returned byte length against authoritative metadata, then atomically append `ATTACHMENT_DOWNLOADED` evidence. Attachment ID, message ID, thread ID, grant ID, queue data, or a previously valid grant is never sufficient by itself.

          External-facing lookup and content failures are collapsed to a conservative access-denied result so the application does not unnecessarily disclose which grant, thread, message, attachment, or content object exists.
          ''',
              "docs/architecture/DATA_FLOW.md": r'''
          ## Release 0.8 external attachment retrieval flow

          1. The caller presents deployment ID, thread ID, grant ID, bearer secret, message ID, and attachment ID to the application-layer external retrieval service.
          2. Existing AccessGrant validation authoritatively proves verifier match, deployment/thread scope, explicit `ATTACHMENT_READ`, unrevoked state, server-time expiry, and current thread eligibility.
          3. The shared attachment retrieval path loads the authoritative message and attachment and verifies deployment/thread/message ownership.
          4. Retrieval proceeds only when the attachment is exactly `CLEAN` and not deleted.
          5. Protected content is resolved through the existing provider-neutral content port and its returned byte length must equal authoritative attachment metadata.
          6. Only after successful content and integrity validation is minimized `ATTACHMENT_DOWNLOADED` evidence committed with opaque external actor/grant attribution.
          7. The application returns only safe download filename, normalized media type, byte length, and bytes required by a future delivery adapter.

          Staff retrieval follows the same steps after its separate current staff/queue authorization gate. There is no second weaker attachment safety pipeline.
          ''',
              "docs/security/AUTHORIZATION.md": r'''
          ## Release 0.8 external attachment authorization

          `THREAD_READ` does not authorize attachment retrieval. External attachment retrieval requires a grant explicitly carrying `ATTACHMENT_READ`, and issuance requires the current AccessGrant policy to allow that operation. A grant carrying only attachment-read authority cannot retrieve the conversation unless `THREAD_READ` is separately granted.

          Every external attachment use revalidates the bearer verifier, grant deployment/thread, explicit operation, revocation, expiry using authoritative server time, and current external-access thread eligibility. `EXPIRED` and `DISPOSED` threads remain ineligible and grant use never transitions lifecycle.

          After grant authorization, authoritative message and attachment ownership and the Release 0.6 attachment safety/content invariant are mandatory. No identifier alone is authority. External failures remain conservative and do not expose internal authorization or storage details.
          ''',
              "docs/security/THREAT_MODEL.md": r'''
          ## Release 0.8 external attachment retrieval threats

          Release 0.8 treats bearer-secret theft, operation confusion, cross-deployment/thread attachment access, identifier enumeration, stale/revoked/expired authority, unsafe attachment-state bypass, protected-content substitution or absence, and metadata/content length mismatch as explicit threats.

          Mitigations include high-entropy server-generated bearer material with persisted one-way verifier only, explicit `ATTACHMENT_READ`, current policy enforcement at issuance, per-use grant and thread revalidation, authoritative message/attachment ownership checks, exactly-`CLEAN` retrieval, protected-content byte-length integrity validation, minimized audit, and conservative external denial responses.

          No browser or email delivery mechanism exists in this release, so URL leakage, cookie capability handling, browser caching, response-header hardening, and delivery-channel replay controls remain a Release 0.9 trust-boundary review rather than being guessed here.
          ''',
              "docs/security/TEST_AND_SECURITY_STRATEGY.md": r'''
          ## Release 0.8 regression requirements

          Executable coverage must prove `THREAD_READ` and `ATTACHMENT_READ` independence, policy rejection when attachment-read is disallowed, wrong-secret/revoked/expired/deployment/thread denial, message and attachment ownership isolation, denial of `PENDING_UPLOAD`, `QUARANTINED`, `REJECTED`, and `DELETED`, exactly-`CLEAN` success, missing/read-failed/inconsistent protected content denial, and no download evidence for any failed retrieval.

          Successful external retrieval must emit minimized `ATTACHMENT_DOWNLOADED` evidence only after integrity validation, with no bearer secret, verifier, content reference, or bytes in audit. Tests also preserve staff retrieval, Release 0.7 AccessGrant behavior, the concurrent attachment-count invariant, and the evidence separation `Opened != Downloaded != Transferred/Filed != Completed`.

          Release 0.8 adds no browser surface; existing Playwright/axe coverage remains regression coverage for the development shell rather than evidence of a public external endpoint.
          ''',
              "docs/development/DEVELOPMENT.md": r'''
          ## Release 0.8 development boundary

          External attachment retrieval is application-layer only. Do not add an HTTP route, grant secret in a URL/path/query, capability cookie, email delivery, external reply, cloud persistence adapter, or production identity integration as part of this release.

          New retrieval implementations must reuse `retrieveAuthorizedAttachment` after their authority source is established rather than reimplementing attachment ownership, `CLEAN` state, protected-content, byte-length, or download-evidence checks. Provider-specific delivery and storage adapters must remain outside domain semantics.
          ''',
          }

          for filename, section in sections.items():
              path = Path(filename)
              text = path.read_text()
              marker = section.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + "\n\n" + section.strip() + "\n")

          release = Path("docs/releases/0.8-external-attachment-retrieval.md")
          release.write_text(r'''# Release 0.8 — External Attachment Retrieval Core Prototype

          ## Scope

          Release 0.8 extends the provider-neutral AccessGrant prototype with explicit `ATTACHMENT_READ` and an application-layer external attachment retrieval service. It introduces no public browser/API delivery surface and no production infrastructure.

          ## Authority separation

          - `THREAD_READ` authorizes external conversation projection only.
          - `ATTACHMENT_READ` authorizes eligible attachment retrieval only.
          - Mixed grants may carry both operations, but each is checked independently.
          - Current AccessGrant policy must explicitly allow every requested operation.
          - Staff retrieval continues to require current staff authorization, queue scope, and staff `ATTACHMENT_READ` permission.

          ## Shared authoritative safety path

          Staff and external retrieval now converge after authorization on one shared application primitive. That path verifies authoritative message scope; attachment deployment, thread, and message ownership; exactly `CLEAN` state and no deletion marker; protected-content availability; and byte-length equality with authoritative metadata. Only after those checks pass may `ATTACHMENT_DOWNLOADED` be committed.

          External failures are intentionally collapsed to the conservative external access-denied result. The external retrieval result exposes only the derived safe-download filename, normalized media type, byte length, and byte payload needed by a future HTTP delivery adapter. Protected-content references and provider implementation details remain internal.

          ## Evidence

          Successful external download records `ATTACHMENT_DOWNLOADED` with bounded opaque external actor, grant, thread, and attachment attribution. Raw bearer secret, verifier, file bytes, content reference, unrestricted original filename, and message body are not audit fields.

          The evidence invariant remains:

          `Opened != Downloaded != Transferred/Filed != Completed`

          External download does not create TransferAttestation and does not complete or otherwise transition the thread.

          ## Deferred browser-delivery boundary

          Release 0.8 intentionally has no public grant URL, email link, capability cookie, public attachment HTTP endpoint, production authentication, or external reply. Release 0.9 should separately review bearer delivery, browser/session behavior, response headers, caching, replay controls, and related HTTP trust-boundary decisions.

          ## Cost and dependencies

          No dependency is added. No production service or infrastructure is provisioned. New recurring cost is **$0**.
          ''')
      - name: Advance release metadata
        run: npm version 0.8.0 --no-git-tag-version --ignore-scripts
      - name: Format and validate implementation
        run: |
          npx --no-install prettier --write .
          npm run lint
          npm run typecheck
          npm run test
      - name: Commit permanent Release 0.8 changes
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add README.md docs package.json package-lock.json src tests
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
            exit 1
          fi
          git commit -m "Finalize Release 0.8 external attachment retrieval"
          git push origin HEAD:release/0.8-external-attachment-retrieval
