name: Release 0.7 Lint Fix

on:
  push:
    branches:
      - release/0.7-access-grant-core
    paths:
      - ".github/workflows/r07-lint-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.7-access-grant-core
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply explicit non-autofix corrections
        shell: python
        run: |
          from pathlib import Path

          service = Path("src/application/access-grant-service.ts")
          text = service.read_text()
          old = '''    let secretMatches = false;\n    try {\n      secretMatches = await this.secrets.matches(\n        input.secret,\n        grant.verifierDigest,\n      );\n    } catch {\n      secretMatches = false;\n    }'''
          new = '''    const secretMatches = await this.secrets\n      .matches(input.secret, grant.verifierDigest)\n      .catch(() => false);'''
          if old not in text:
              raise SystemExit("Expected verifier-match block not found")
          service.write_text(text.replace(old, new))

          test = Path("tests/integration/attachment-count-concurrency.test.ts")
          text = test.read_text()
          text = text.replace(
              'import { ApplicationError } from "../../src/application/errors.js";\n',
              '',
          )
          block = '''    const reason = (rejected[0] as PromiseRejectedResult).reason;\n    expect(reason).toBeInstanceOf(ApplicationError);\n    expect((reason as ApplicationError).code).toBe(\n      "ATTACHMENT_POLICY_REJECTED",\n    );\n'''
          if block not in text:
              raise SystemExit("Expected rejected-reason assertion block not found")
          test.write_text(text.replace(block, ''))
      - name: Apply safe ESLint fixes and validate focused correction
        run: |
          npx --no-install eslint --fix src/adapters/in-memory-workflow-store.ts tests/integration/attachment-count-concurrency.test.ts
          npx --no-install prettier --write src/adapters/in-memory-workflow-store.ts src/application/access-grant-service.ts tests/integration/attachment-count-concurrency.test.ts
          npm run lint
          npm run typecheck
      - name: Commit focused correction
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add src/adapters/in-memory-workflow-store.ts src/application/access-grant-service.ts tests/integration/attachment-count-concurrency.test.ts
          git commit -m "Fix Release 0.7 lint and strict typing"
          git push origin HEAD:release/0.7-access-grant-core
