name: Release 0.7 Lint Fix

on:
  push:
    branches:
      - release/0.7-access-grant-core
    paths:
      - ".github/workflows/r07-lint-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.7-access-grant-core
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply explicit lint and type corrections
        shell: python
        run: |
          from pathlib import Path

          store = Path("src/adapters/in-memory-workflow-store.ts")
          text = store.read_text()
          replacements = [
              (
                  '''      if (\n        current === undefined ||\n        current.version !== mutation.expectedThreadVersion\n      ) {''',
                  '''      if (current?.version !== mutation.expectedThreadVersion) {''',
              ),
              (
                  '''      if (\n        policy === undefined ||\n        policy.policyRef !== guard.attachmentPolicyRef\n      ) {''',
                  '''      if (policy?.policyRef !== guard.attachmentPolicyRef) {''',
              ),
              (
                  '''    if (policy === undefined || policy.policyRef !== grant.policyRef) {''',
                  '''    if (policy?.policyRef !== grant.policyRef) {''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected store correction block not found: {old[:40]}")
              text = text.replace(old, new, 1)
          store.write_text(text)

          service = Path("src/application/access-grant-service.ts")
          text = service.read_text()
          old = '''    let secretMatches = false;\n    try {\n      secretMatches = await this.secrets.matches(\n        input.secret,\n        grant.verifierDigest,\n      );\n    } catch {\n      secretMatches = false;\n    }'''
          new = '''    const secretMatches = await this.secrets\n      .matches(input.secret, grant.verifierDigest)\n      .catch(() => false);'''
          if old not in text:
              raise SystemExit("Expected verifier-match block not found")
          service.write_text(text.replace(old, new, 1))

          concurrency = Path("tests/integration/attachment-count-concurrency.test.ts")
          text = concurrency.read_text()
          text = text.replace(
              'import { ApplicationError } from "../../src/application/errors.js";\n',
              '',
              1,
          )
          text = text.replace(
              'import { DomainError } from "../../src/domain/errors.js";\n',
              'import type { DomainError } from "../../src/domain/errors.js";\n',
              1,
          )
          block = '''    const reason = (rejected[0] as PromiseRejectedResult).reason;\n    expect(reason).toBeInstanceOf(ApplicationError);\n    expect((reason as ApplicationError).code).toBe(\n      "ATTACHMENT_POLICY_REJECTED",\n    );\n'''
          if block not in text:
              raise SystemExit("Expected rejected-reason assertion block not found")
          text = text.replace(block, '', 1)
          text = text.replace(
              ').rejects.toMatchObject<Partial<DomainError>>({',
              ').rejects.toMatchObject({',
              1,
          )
          concurrency.write_text(text)

          access_test = Path("tests/integration/access-grant-service.test.ts")
          text = access_test.read_text()
          old = '''    readonly actorPermissions?: readonly ReturnType<\n      typeof makeActorAuthorization\n    >["permissions"];'''
          new = '''    readonly actorPermissions?: ReturnType<\n      typeof makeActorAuthorization\n    >["permissions"];'''
          if old not in text:
              raise SystemExit("Expected actorPermissions type block not found")
          access_test.write_text(text.replace(old, new, 1))
      - name: Format and validate focused correction
        run: |
          npx --no-install prettier --write src/adapters/in-memory-workflow-store.ts src/application/access-grant-service.ts tests/integration/access-grant-service.test.ts tests/integration/attachment-count-concurrency.test.ts
          npm run lint
          npm run typecheck
      - name: Commit focused correction
        run: |
          git config user.name "Eddie-LowcountryDigitalWorks"
          git config user.email "eddie@lowcountrydigitalworks.com"
          git add src/adapters/in-memory-workflow-store.ts src/application/access-grant-service.ts tests/integration/access-grant-service.test.ts tests/integration/attachment-count-concurrency.test.ts
          git commit -m "Fix Release 0.7 lint and strict typing"
          git push origin HEAD:release/0.7-access-grant-core
